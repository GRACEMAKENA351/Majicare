{% extends "base.html" %}

{% block title %}Report an Issue | MajiCare{% endblock %}

{% block content %}
<section class="form-section">
    <div class="form-card">
        <div class="form-icon">🚰</div>
        <span class="eyebrow">REPORT WATER ISSUE</span>
        <h1>Submit a Report</h1>
        <p>Tell us what is happening so the right people can respond.</p>

        <form method="POST" action="{{ url_for('create_report') }}">
            <label for="title">Issue title</label>
            <input id="title" name="title" type="text" required placeholder="e.g. Broken tap near the clinic">

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select a category</option>
                <option value="Water Shortage">Water Shortage</option>
                <option value="Broken Tap">Broken Tap</option>
                <option value="Broken Borehole">Broken Borehole</option>
                <option value="Water Quality">Water Quality</option>
                <option value="Other">Other</option>
            </select>

            <label for="county">County</label>
            <select id="county" name="county" required>
                <option value="">Select a county</option>
                {% for county in counties %}
                    <option value="{{ county }}">{{ county }}</option>
                {% endfor %}
            </select>

            <label for="area">Area of incident</label>
            <select id="area" name="area" required disabled>
                <option value="">Select a county first</option>
            </select>

            <div id="other-area-field" hidden>
                <label for="other-area">Enter the area</label>
                <input id="other-area" name="other_area" type="text" maxlength="200" placeholder="Village, market, school, or landmark">
            </div>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="5" required placeholder="Describe the problem and any urgent details..."></textarea>

            <button class="btn btn-primary btn-full" type="submit">Submit Report</button>
        </form>
    </div>
</section>

<script>
    const countyAreas = {{ county_areas|tojson }};
    const countySelect = document.getElementById("county");
    const areaSelect = document.getElementById("area");
    const otherAreaField = document.getElementById("other-area-field");
    const otherAreaInput = document.getElementById("other-area");

    countySelect.addEventListener("change", function () {
        areaSelect.replaceChildren(new Option("Select an area", ""));
        const areas = countyAreas[countySelect.value] || [];

        areas.forEach(function (area) {
            areaSelect.add(new Option(area, area));
        });

        areaSelect.add(new Option("Other area (enter manually)", "Other"));
        areaSelect.disabled = false;
        otherAreaField.hidden = true;
        otherAreaInput.required = false;
        otherAreaInput.value = "";
    });

    areaSelect.addEventListener("change", function () {
        const isOther = areaSelect.value === "Other";
        otherAreaField.hidden = !isOther;
        otherAreaInput.required = isOther;
    });
</script>
{% endblock %}
