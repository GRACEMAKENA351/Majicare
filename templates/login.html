<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="MajiCare - Community Water Management">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Sign In | MajiCare</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 32px;
            max-width: 400px;
            margin: 60px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="form-icon">🔐</div>
            <span class="eyebrow">WELCOME BACK</span>
            <h1>Sign In</h1>
            <p>Access your MajiCare community dashboard.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flashes">
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" required autocomplete="username" placeholder="Enter your username">
                    <span class="error-message" id="username-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Enter your password">
                    <span class="error-message" id="password-error"></span>
                </div>

                <button class="btn btn-primary btn-full" type="submit">Sign In</button>
            </form>

            <p class="form-footer">New to MajiCare? <a href="{{ url_for('register') }}">Create an account</a></p>
        </div>
    </div>
</body>
</html>
